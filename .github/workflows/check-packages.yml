name: Check package versions

on:
  push:
    branches: [dev]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: check-packages
  cancel-in-progress: true

jobs:
  check-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Guix
        run: |
          curl -L https://guix.gnu.org/install.sh -o /tmp/guix-install.sh
          chmod +x /tmp/guix-install.sh
          # install.sh hardcodes ftpmirror.gnu.org, whose redirector regularly
          # 502s on the .sig file and aborts the install.  Use ftp.gnu.org.
          sed -i 's|https://ftpmirror.gnu.org/gnu/guix/|https://ftp.gnu.org/gnu/guix/|' /tmp/guix-install.sh
          echo | sudo /tmp/guix-install.sh
          sudo systemctl start guix-daemon

      # kubeseal needs (gnu packages kubernetes), absent from the 1.5.0 binary.
      # Only the guix channel is pulled, so this is served by substitutes
      # instead of being rebuilt; nonguix is supplied via -L below because it
      # has no substitutes and would have to be compiled during the pull.
      - name: guix pull
        run: |
          guix pull
          echo "$HOME/.config/guix/current/bin" >> $GITHUB_PATH

      # gh uses (nonguix build-system binary); a shallow checkout on the load
      # path is enough for `guix refresh`, which never builds anything.
      - name: Fetch nonguix
        run: git clone --depth 1 https://gitlab.com/nonguix/nonguix /tmp/nonguix

      - name: List packages and run guix refresh
        id: check
        env:
          # Without a token the GitHub updater hits the 60 req/h anonymous
          # rate limit and silently reports packages as up to date.
          GUIX_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # list-packages.scm swallows resolve-interface failures, so nonguix
          # must be on the load path here too or gh drops off the list unseen.
          packages=$(guix repl -L /tmp/nonguix -- scripts/list-packages.scm | tr '\n' ' ')

          echo "checking: $packages"

          output=$(LANG=C guix refresh -L . -L /tmp/nonguix $packages 2>&1 || true)
          echo "$output"

          # `guix refresh` only warns when a module fails to load and still
          # exits 0, which would silently skip those packages and report a
          # green run.  Treat it as a failure instead.
          if echo "$output" | grep -q "failed to load"; then
            echo "::error::some package modules failed to load, see log above"
            exit 1
          fi

          outdated=$(echo "$output" | grep "would be upgraded" || true)

          if [ -n "$outdated" ]; then
            echo "has_outdated=true" >> $GITHUB_OUTPUT
            {
              echo "report<<REPORT_EOF"
              echo "$outdated"
              echo "REPORT_EOF"
            } >> $GITHUB_OUTPUT
          else
            echo "has_outdated=false" >> $GITHUB_OUTPUT
          fi

      - name: Ensure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "outdated-packages" \
            --color "e4e669" \
            --description "Package needs version bump" 2>/dev/null || true

      - name: Create or update issues
        if: steps.check.outputs.has_outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          echo "$REPORT" | while IFS= read -r line; do
            pkg=$(echo "$line" | sed 's/.*: \([^ ]*\) would be upgraded from.*/\1/')
            old=$(echo "$line" | sed 's/.*upgraded from \([^ ]*\) to.*/\1/')
            new=$(echo "$line" | sed 's/.*upgraded from [^ ]* to \([^ ]*\)/\1/')

            title="update ${pkg}: ${old} → ${new}"

            existing=$(gh issue list \
              --label "outdated-packages" \
              --state open \
              --search "$pkg" \
              --json number,title \
              --jq ".[] | select(.title | startswith(\"update ${pkg}:\")) | .number" \
              | head -1)

            if [ -n "$existing" ]; then
              gh issue edit "$existing" --title "$title"
            else
              gh issue create \
                --title "$title" \
                --body "Nouvelle version \`${new}\` disponible pour \`${pkg}\` (actuellement \`${old}\`)." \
                --label "outdated-packages"
            fi
          done

      - name: Close resolved issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          outdated_pkgs=$(echo "$REPORT" | sed 's/.*: \([^ ]*\) would be upgraded from.*/\1/' | sort)

          gh issue list \
            --label "outdated-packages" \
            --state open \
            --json number,title \
            --jq '.[] | "\(.number) \(.title)"' | while IFS= read -r entry; do
              number=$(echo "$entry" | awk '{print $1}')
              pkg=$(echo "$entry" | sed 's/^[0-9]* update \([^:]*\):.*/\1/')

              if ! echo "$outdated_pkgs" | grep -qx "$pkg"; then
                gh issue close "$number" --comment "Paquet \`${pkg}\` à jour."
              fi
            done
