name: Check package versions

on:
  push:
    branches: [dev]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: check-packages
  cancel-in-progress: true

jobs:
  check-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # TODO: drop these two steps once the Forgejo runner is up -- it will
      # have Guix and the channel already, which is the whole reason this job
      # is slow here.  On GitHub's runners we have to build that from scratch:
      # `guix pull` for (gnu packages kubernetes), which kubeseal imports and
      # the 1.5.0 binary does not carry.
      - name: Install Guix
        run: |
          curl -L https://guix.gnu.org/install.sh -o /tmp/guix-install.sh
          chmod +x /tmp/guix-install.sh
          # install.sh hardcodes ftpmirror.gnu.org, whose redirector 502s on
          # the .sig file often enough to break the install outright.
          sed -i 's|https://ftpmirror.gnu.org/gnu/guix/|https://ftp.gnu.org/gnu/guix/|' /tmp/guix-install.sh
          echo | sudo /tmp/guix-install.sh
          sudo systemctl start guix-daemon
          guix pull
          echo "$HOME/.config/guix/current/bin" >> $GITHUB_PATH

      # gh uses (nonguix build-system binary).  A shallow checkout on the load
      # path is enough: we only read the definitions, we never build them.
      - name: Fetch nonguix
        run: git clone --depth 1 https://gitlab.com/nonguix/nonguix /tmp/nonguix

      - name: Check for updates
        id: check
        env:
          # Without a token the GitHub updater hits the 60 req/h anonymous
          # rate limit and reports packages as up to date.
          GUIX_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The script exits non-zero if any package could not be checked, so
          # a partial result fails the job instead of passing as green.
          report=$(guix repl -L /tmp/nonguix -- scripts/check-updates.scm)

          if [ -n "$report" ]; then
            echo "has_outdated=true" >> $GITHUB_OUTPUT
            {
              echo "report<<REPORT_EOF"
              echo "$report"
              echo "REPORT_EOF"
            } >> $GITHUB_OUTPUT
          else
            echo "has_outdated=false" >> $GITHUB_OUTPUT
          fi

      - name: Ensure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "outdated-packages" \
            --color "e4e669" \
            --description "Package needs version bump" 2>/dev/null || true

      - name: Create or update issues
        if: steps.check.outputs.has_outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          echo "$REPORT" | while IFS=$'\t' read -r pkg old new; do
            [ -n "$pkg" ] || continue

            title="update ${pkg}: ${old} → ${new}"

            existing=$(gh issue list \
              --label "outdated-packages" \
              --state open \
              --search "$pkg" \
              --json number,title \
              --jq ".[] | select(.title | startswith(\"update ${pkg}:\")) | .number" \
              | head -1)

            if [ -n "$existing" ]; then
              gh issue edit "$existing" --title "$title"
            else
              gh issue create \
                --title "$title" \
                --body "Nouvelle version \`${new}\` disponible pour \`${pkg}\` (actuellement \`${old}\`)." \
                --label "outdated-packages"
            fi
          done

      - name: Close resolved issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          outdated_pkgs=$(echo "$REPORT" | cut -f1)

          gh issue list \
            --label "outdated-packages" \
            --state open \
            --json number,title \
            --jq '.[] | "\(.number) \(.title)"' | while IFS= read -r entry; do
              number=$(echo "$entry" | awk '{print $1}')
              pkg=$(echo "$entry" | sed 's/^[0-9]* update \([^:]*\):.*/\1/')

              if ! echo "$outdated_pkgs" | grep -qx "$pkg"; then
                gh issue close "$number" --comment "Paquet \`${pkg}\` à jour."
              fi
            done
