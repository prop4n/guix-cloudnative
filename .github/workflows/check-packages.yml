name: Check package versions

on:
  push:
    branches: [dev]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: check-packages
  cancel-in-progress: true

jobs:
  check-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # guile-gnutls gives (web client) HTTPS support; without it every
      # request to github.com fails.
      - name: Install Guile
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends guile-3.0 guile-gnutls

      - name: Check for updates
        id: check
        run: |
          # The script exits non-zero if any package could not be checked, so
          # a partial result fails the job instead of passing as green.
          report=$(guile --no-auto-compile scripts/check-updates.scm)

          if [ -n "$report" ]; then
            echo "has_outdated=true" >> $GITHUB_OUTPUT
            {
              echo "report<<REPORT_EOF"
              echo "$report"
              echo "REPORT_EOF"
            } >> $GITHUB_OUTPUT
          else
            echo "has_outdated=false" >> $GITHUB_OUTPUT
          fi

      - name: Ensure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "outdated-packages" \
            --color "e4e669" \
            --description "Package needs version bump" 2>/dev/null || true

      - name: Create or update issues
        if: steps.check.outputs.has_outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          echo "$REPORT" | while IFS=$'\t' read -r pkg old new; do
            [ -n "$pkg" ] || continue

            title="update ${pkg}: ${old} → ${new}"

            existing=$(gh issue list \
              --label "outdated-packages" \
              --state open \
              --search "$pkg" \
              --json number,title \
              --jq ".[] | select(.title | startswith(\"update ${pkg}:\")) | .number" \
              | head -1)

            if [ -n "$existing" ]; then
              gh issue edit "$existing" --title "$title"
            else
              gh issue create \
                --title "$title" \
                --body "Nouvelle version \`${new}\` disponible pour \`${pkg}\` (actuellement \`${old}\`)." \
                --label "outdated-packages"
            fi
          done

      - name: Close resolved issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          outdated_pkgs=$(echo "$REPORT" | cut -f1)

          gh issue list \
            --label "outdated-packages" \
            --state open \
            --json number,title \
            --jq '.[] | "\(.number) \(.title)"' | while IFS= read -r entry; do
              number=$(echo "$entry" | awk '{print $1}')
              pkg=$(echo "$entry" | sed 's/^[0-9]* update \([^:]*\):.*/\1/')

              if ! echo "$outdated_pkgs" | grep -qx "$pkg"; then
                gh issue close "$number" --comment "Paquet \`${pkg}\` à jour."
              fi
            done
